name: Daily AI Builders Site

concurrency:
  group: daily-site-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm ci

      - name: Build static site
        run: node scripts/build-site.js

      - name: Commit generated site data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/index.html public/app.js public/styles.css

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update AI Builders Daily site [skip ci]"

            if ! git pull --rebase origin main; then
              echo "::error::Failed to rebase generated site update on origin/main before pushing."
              exit 1
            fi

            if ! git push origin main; then
              echo "::error::Failed to push generated site update to origin/main. Check workflow permissions, branch protection, and concurrent updates."
              exit 1
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
